<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabonk! Game Room</title>
    <link rel="stylesheet" href="/css/room.css">
</head>

<body>
    <!-- status while connecting -->
    <p id="status" role="status">Connecting to the room...</p>
    <a id="back-home" href="/">Back to home</a>

    <div class="popup" id="name-modal" hidden>
        <form class="popup-box" id="name-form">
            <h2>Enter your name</h2>
            <label for="name-input">Your name</label>
            <input id="name-input" maxlength="20" autocomplete="off" required>
            <p id="name-error" hidden></p>
            <button type="submit" class="big-button">Join</button>
        </form>
    </div>

    <!-- game room -->
    <div id="room" hidden>
        <div id="game">

            <h1 id="title">Kabonk!</h1>

            <!-- prompt/answer box -->
            <div id="prompt-area">
                <p id="prompt"></p>
                <p id="timer"></p>
                <input id="answer-input" type="text" placeholder="Type here" autocomplete="off" disabled>

                <p id="attempt"></p>
                <p id="last-result"></p>
            </div>

            <div id="lobby-controls">
                <button id="start-game" type="button" hidden>Start Game</button>
                <p id="lobby-message"></p>
            </div>

            <!-- players sitting in a circle-->
            <div id="circle">
                <div id="arrow" hidden></div>
                <div id="bomb">💣</div>
            </div>

            <div id="bottom-bar">
                <span>Invite Code: <span id="invite-code"></span></span>
                <button id="copy-link" type="button">Copy invite link</button>
                <button id="leave-room" type="button">Leave Room</button>
            </div>

        </div>
        <aside id="chat-panel" aria-labelledby="chat-heading">
            <h2 id="chat-heading">Room chat</h2>
            <ul id="chat-messages" role="log" aria-live="polite" aria-relevant="additions"></ul>
            <form id="chat-form">
                <label for="chat-input">Message</label>
                <input id="chat-input" maxlength="500" autocomplete="off" required disabled>
                <button id="chat-send" type="submit" disabled>Send</button>
            </form>
        </aside>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/room.js"></script>
</body>

</html>
